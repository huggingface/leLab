name: Rebuild frontend/dist

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '!frontend/dist/**'
      - '!frontend/__init__.py'
      - '.github/workflows/build_frontend.yml'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: rebuild-frontend-dist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: main
          lfs: true
          persist-credentials: false
      - uses: actions/setup-node@v7.0.0
        with:
          # Vite 8 requires ^20.19.0 or >=22.12.0; on Node 18 `npm run build`
          # fails, which silently stops dist from being rebuilt.
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      # Requires Actions > General > Allow GitHub Actions to create and approve pull requests.
      - name: Open or update dist pull request
        id: dist-pr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          branch: automation/frontend-dist
          base: main
          add-paths: frontend/dist
          commit-message: "ci: rebuild frontend/dist"
          title: "ci: rebuild frontend/dist"
          body: |
            Rebuild the frontend bundle shipped with Python installations from main.

            Merge this PR after the required checks and review to distribute the latest UI.
      # GITHUB_TOKEN-created PRs do not trigger pull_request workflows.
      # Dispatch the required check explicitly on the generated branch.
      - name: Run required quality check on dist pull request
        if: steps.dist-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run quality.yml --ref automation/frontend-dist
